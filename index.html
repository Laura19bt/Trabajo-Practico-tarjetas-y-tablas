<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de Perfil franco</title>
  <link rel="stylesheet" href="style.css">
  <!-- Iconos de redes (usamos Font Awesome CDN) -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  
</head>
<body>
  <section class="tarjeta">
    <div class="header-img">
      <img src="./img/Fondomilo.png" alt="fondo Milo">
    </div>
    <div class="perfil-img">
      <img src="./img/Milo.jpeg" alt="Milo">
    </div>
    <div class="contenido">
      <h2>Milo J</h2>
      <p class="ubicacion">Camilo Joaquín Villaruel</p>
      <p class="descripcion">
        Camilo Joaquín Villarruel, es un rapero y cantautor argentino que nació en Morón, provincia de Buenos Aires, el 25 de octubre de 2006.  </p>
      <button>Seguir</button>
      <div class="redes">
        <a href="https://www.instagram.com/milo.j/?hl=es"><img src="./img/instagram.png" alt=""></a>
        <a href="https://www.youtube.com/@miloj"><img src="./img/youtube.png" alt=""></a>
        <a href="https://www.facebook.com/?locale=es_LA"><img src="./img/face.png" alt=""></a>
        <a href="https://web.whatsapp.com/"><img src="./img/whatsapp.png" alt=""></a>
      </div>
    </div>
  </section>
</body>
</html>
